site_name: BULWARK
site_description: Continuous Third-Party Assurance Fleet — Fortified Enterprise Fleet track
site_url: https://akashtalole.github.io/BULWARK-Agents/
repo_name: akashtalole/BULWARK-Agents
repo_url: https://github.com/akashtalole/BULWARK-Agents
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Diagrams: DIAGRAMS.md
  - Setup Guide: SETUP_GUIDE.md
  - User Guide: USER_GUIDE.md
  - Testing Guide: TESTING_GUIDE.md

theme:
  name: material
  icon:
    logo: material/shield-lock-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/akashtalole/BULWARK-Agents
