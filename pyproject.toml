[project]
name = "bulwark"
version = "0.1.0"
description = "Continuous Third-Party Assurance Fleet -- Fortified Enterprise Fleet track."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.7.0",
    "google-cloud-firestore>=2.0.0",
    "google-cloud-pubsub>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
