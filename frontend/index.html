<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BULWARK — Assurance Fleet</title>
    <meta name="description" content="Continuous third-party assurance fleet dashboard" />
    <script>
      // Set data-theme before React mounts (and before the CSS below has
      // painted anything) so there's no flash of the wrong theme on
      // load -- lib/theme.tsx's ThemeProvider picks up this same value
      // on its first render instead of re-deciding it.
      (function () {
        try {
          var stored = localStorage.getItem("bulwark.theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // localStorage/matchMedia unavailable (private mode, etc.) -- default dark, same as before this existed.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
